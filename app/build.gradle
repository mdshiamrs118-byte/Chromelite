plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-kapt'
}

android {
    namespace 'com.boxweb.browser'
    compileSdk 34         // required by androidx.webkit 1.12 (runtime target stays 29)

    defaultConfig {
        applicationId "com.boxweb.browser"
        minSdk 21
        targetSdk 29          // Android 10
        versionCode 1
        versionName "1.0.0"
    }

    // Release signing. GitHub secrets (KEYSTORE_FILE, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD)
    // win when present; otherwise the keystore committed next to this file is used, so every
    // build is signed with the same key and new APKs install over old ones.
    signingConfigs {
        release {
            def envKeystore = System.getenv("KEYSTORE_FILE")
            if (envKeystore) {
                storeFile file(envKeystore)
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            } else {
                storeFile file("boxweb-release.jks")
                storePassword "boxweb-release"
                keyAlias "boxweb"
                keyPassword "boxweb-release"
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            // Code shrinking is off on purpose: it is the usual cause of release-only crashes
            // (reflection in WebView / Room) and cannot be tested without a device.
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ".debug"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }

    buildFeatures {
        viewBinding true
    }

    // A release build should not be blocked by lint warnings (e.g. the deliberate old targetSdk).
    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.10.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    // 1.12.x: Profile API (isolated cookies/storage/cache per profile); still supports minSdk 21 (1.15+ needs 23)
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.activity:activity-ktx:1.7.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.1'

    // Room (history + bookmarks)
    implementation 'androidx.room:room-runtime:2.5.2'
    implementation 'androidx.room:room-ktx:2.5.2'
    kapt 'androidx.room:room-compiler:2.5.2'
}
