name: Android CI

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:        # lets you press "Run workflow" manually in the Actions tab

permissions:
  contents: write           # needed to attach the APK to a GitHub Release on tags

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # The Android SDK is preinstalled on ubuntu-latest runners.
      # Gradle is installed by this action, so no gradlew / wrapper jar is required.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 7.6.3

      - name: Build release APK
        run: gradle assembleRelease --stacktrace

      - name: Name the APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk dist/BoxWeb-${{ github.run_number }}.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: BoxWeb-release-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk

      - name: Upload lint/compile reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: app/build/reports/
          if-no-files-found: ignore
